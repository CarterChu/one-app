<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞检管理原型 · 预览</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e9ebf0;
      }
      .device {
        position: relative;
        width: 414px;
        height: 868px;
        max-height: 96vh;
        background: #111418;
        border-radius: 48px;
        padding: 12px;
        box-shadow: 0 24px 70px rgba(20, 24, 40, 0.28);
        box-sizing: border-box;
      }
      .device__screen {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 38px;
        background: #fff;
        display: block;
      }
      @media (max-width: 480px) {
        body {
          background: #fff;
        }
        .device {
          width: 100vw;
          height: 100vh;
          max-height: none;
          border-radius: 0;
          padding: 0;
          box-shadow: none;
        }
        .device__screen {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="device">
      <iframe class="device__screen" src="/app.html" title="ONE App 原型"></iframe>
    </div>
  </body>
</html>
